<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>launch-video stage</title>
    <!--
      Deterministic scene runtime for launch videos. driver.mjs loads this
      page, calls window.__init(data) once, then window.__seek(t) for every
      frame and screenshots #stage. Nothing here may depend on wall-clock time.
    -->
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: #000;
        overflow: hidden;
      }
      #stage {
        position: relative;
        overflow: hidden;
        transform-origin: 0 0;
        background: var(--bg);
        color: var(--fg);
        font-family: var(--font-body), Inter, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: geometricPrecision;
      }
      .bg,
      .fx,
      .layer {
        position: absolute;
        inset: 0;
      }
      .layer {
        display: flex;
        align-items: center;
        justify-content: center;
        will-change: transform, opacity, filter;
      }
      .blob {
        position: absolute;
        border-radius: 50%;
      }
      .grid-lines {
        position: absolute;
        inset: -10%;
        background-image:
          linear-gradient(var(--line) 1px, transparent 1px),
          linear-gradient(90deg, var(--line) 1px, transparent 1px);
        background-size: 72px 72px;
        -webkit-mask-image: radial-gradient(
          ellipse 60% 55% at 50% 50%,
          #000 20%,
          transparent 75%
        );
      }
      .grain {
        position: absolute;
        inset: 0;
        opacity: var(--grain);
        mix-blend-mode: overlay;
        pointer-events: none;
      }
      .vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          ellipse at center,
          transparent 55%,
          rgba(0, 0, 0, var(--vignette)) 100%
        );
      }

      .display {
        font-family: var(--font-display), Inter, sans-serif;
        font-weight: var(--w-display);
        letter-spacing: var(--tracking);
        line-height: 1.02;
      }
      .eyebrow {
        font-family: var(--font-mono), monospace;
        text-transform: uppercase;
        letter-spacing: 0.22em;
        font-size: 22px;
        color: var(--accent2);
        display: inline-flex;
        align-items: center;
        gap: 14px;
      }
      .eyebrow::before {
        content: '';
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 18px var(--accent);
      }
      .sub {
        color: var(--muted);
        font-size: 34px;
        line-height: 1.35;
        font-weight: 450;
      }
      .center {
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 30px;
        padding: 0 8%;
      }
      .w {
        display: inline-block;
        white-space: pre;
      }
      .mask {
        display: inline-block;
        overflow: hidden;
        vertical-align: bottom;
        padding: 0 0.04em 0.12em;
        margin-bottom: -0.12em;
      }
      .hl-gradient {
        background: linear-gradient(
          100deg,
          var(--accent) 0%,
          var(--accent2) 100%
        );
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .hl-pill {
        position: relative;
        color: var(--on-accent);
        padding: 0 0.18em;
      }
      .hl-pill > .pillbg {
        position: absolute;
        inset: 0.06em -0.02em 0.02em;
        border-radius: 0.18em;
        background: var(--accent);
        z-index: -1;
        transform-origin: 0 50%;
      }
      .hl-underline {
        position: relative;
      }
      .hl-underline > .bar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0.02em;
        height: 0.09em;
        border-radius: 0.05em;
        background: linear-gradient(90deg, var(--accent), var(--accent2));
        transform-origin: 0 50%;
      }

      .frame {
        position: relative;
        border-radius: var(--radius);
        overflow: hidden;
        background: var(--bg2);
        border: 1px solid var(--line-strong);
        box-shadow:
          0 50px 120px -30px rgba(0, 0, 0, 0.65),
          0 0 0 1px rgba(255, 255, 255, 0.02),
          0 0 120px -40px var(--accent);
      }
      .chrome {
        height: 46px;
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 0 18px;
        background: var(--chrome);
        border-bottom: 1px solid var(--line-strong);
      }
      .chrome i {
        width: 13px;
        height: 13px;
        border-radius: 50%;
        background: var(--line-strong);
        display: block;
      }
      .chrome .url {
        margin-left: 18px;
        flex: 1;
        max-width: 520px;
        height: 28px;
        border-radius: 8px;
        background: rgba(127, 127, 127, 0.12);
        color: var(--muted);
        font:
          15px var(--font-mono),
          monospace;
        display: flex;
        align-items: center;
        padding: 0 14px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .viewport {
        position: relative;
        overflow: hidden;
        background: #fff;
      }
      .cam {
        position: absolute;
        left: 0;
        top: 0;
        transform-origin: 0 0;
      }
      .cam img {
        display: block;
      }
      .cursor {
        position: absolute;
        left: 0;
        top: 0;
        width: 28px;
        height: 28px;
        pointer-events: none;
        filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.35));
      }
      .ripple {
        position: absolute;
        width: 70px;
        height: 70px;
        margin: -35px 0 0 -35px;
        border-radius: 50%;
        border: 3px solid var(--accent);
      }
      .caption {
        position: absolute;
        left: 50%;
        bottom: 46px;
        transform: translateX(-50%);
        display: inline-flex;
        align-items: center;
        gap: 14px;
        padding: 16px 28px;
        border-radius: 999px;
        background: var(--glass);
        border: 1px solid var(--line-strong);
        backdrop-filter: blur(18px);
        font-size: 28px;
        font-weight: 600;
        letter-spacing: -0.01em;
        white-space: nowrap;
      }
      .caption::before {
        content: '';
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 14px var(--accent);
      }

      .cards {
        display: grid;
        gap: 26px;
        width: 100%;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line-strong);
        border-radius: calc(var(--radius) * 0.9);
        padding: 34px 32px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        position: relative;
        overflow: hidden;
      }
      .card::after {
        content: '';
        position: absolute;
        inset: 0 0 auto 0;
        height: 2px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--accent),
          transparent
        );
        opacity: 0.8;
      }
      .card .ic {
        width: 58px;
        height: 58px;
        border-radius: 16px;
        display: grid;
        place-items: center;
        font-size: 30px;
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        color: var(--on-accent);
      }
      .card h3 {
        margin: 6px 0 0;
        font:
          var(--w-display) 32px var(--font-display),
          Inter,
          sans-serif;
        letter-spacing: -0.02em;
      }
      .card p {
        margin: 0;
        color: var(--muted);
        font-size: 23px;
        line-height: 1.4;
      }
      .stat {
        font-size: 260px;
        font-variant-numeric: tabular-nums;
      }
      .cta {
        display: inline-flex;
        align-items: center;
        gap: 14px;
        padding: 22px 40px;
        border-radius: 999px;
        background: var(--accent);
        color: var(--on-accent);
        font-size: 30px;
        font-weight: 700;
        box-shadow: 0 20px 60px -15px var(--accent);
      }
      .url-line {
        font:
          24px var(--font-mono),
          monospace;
        color: var(--muted);
        letter-spacing: 0.02em;
      }
      .mark {
        position: absolute;
        top: 44px;
        left: 52px;
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 700;
        font-size: 24px;
        letter-spacing: -0.01em;
        z-index: 5;
      }
      .mark img {
        height: 34px;
      }
      .mark .dot {
        width: 26px;
        height: 26px;
        border-radius: 8px;
        background: linear-gradient(135deg, var(--accent), var(--accent2));
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script>
      'use strict';
      const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
      const lerp = (a, b, p) => a + (b - a) * p;
      const EASE = {
        linear: p => p,
        cubic: p => 1 - Math.pow(1 - p, 3),
        quint: p => 1 - Math.pow(1 - p, 5),
        expo: p => (p >= 1 ? 1 : 1 - Math.pow(2, -10 * p)),
        back: p => {
          const c1 = 1.4,
            c3 = c1 + 1;
          return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2);
        },
        inout: p => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2),
      };
      const el = (tag, cls, parent, html) => {
        const n = document.createElement(tag);
        if (cls) n.className = cls;
        if (html != null) n.innerHTML = html;
        if (parent) parent.appendChild(n);
        return n;
      };
      const esc = s =>
        String(s ?? '').replace(
          /[&<>"]/g,
          c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]
        );

      let S,
        M,
        E,
        W,
        H,
        VERT,
        BASE,
        scenes = [],
        bgLayer,
        total = 0;

      /** hex -> "r,g,b" for rgba() composition */
      function rgb(hex) {
        const h = hex.replace('#', '');
        const n = parseInt(
          h.length === 3
            ? h
                .split('')
                .map(c => c + c)
                .join('')
            : h,
          16
        );
        return `${(n >> 16) & 255},${(n >> 8) & 255},${n & 255}`;
      }
      function luminance(hex) {
        const [r, g, b] = rgb(hex)
          .split(',')
          .map(v => {
            v /= 255;
            return v <= 0.03928
              ? v / 12.92
              : Math.pow((v + 0.055) / 1.055, 2.4);
          });
        return 0.2126 * r + 0.7152 * g + 0.0722 * b;
      }
      const asset = p => (/^(https?|file|data):/.test(p) ? p : BASE + p);

      // ---- text with *highlight* tokens, \n line breaks, per-word animation ----
      function buildText(parent, text, opts = {}) {
        const words = [];
        const lines = String(text).split('\n');
        lines.forEach((line, li) => {
          // *highlight* may carry trailing punctuation ("*status*.") that stays attached but unhighlighted
          const re = /\*([^*]+)\*([^\s*]*)|(\S+)/g;
          let m;
          while ((m = re.exec(line))) {
            const hl = m[1] != null;
            const wrap = el('span', M.text === 'mask' ? 'mask' : 'w', parent);
            const inner = el('span', 'w', wrap);
            const word = hl
              ? el('span', 'w hl-' + S.highlight, inner, esc(m[1]))
              : null;
            if (hl && m[2]) el('span', null, inner, esc(m[2]));
            if (!hl) inner.textContent = m[3];
            let deco = null;
            if (hl && S.highlight === 'pill') deco = el('span', 'pillbg', word);
            if (hl && S.highlight === 'underline')
              deco = el('span', 'bar', word);
            words.push({ wrap, inner, deco, hl });
            parent.appendChild(document.createTextNode(' '));
          }
          if (li < lines.length - 1) el('br', null, parent);
        });
        return words;
      }
      function animateWords(words, lt, delay = 0, stagger = M.wordStagger) {
        words.forEach((w, i) => {
          const p = E(clamp((lt - delay - i * stagger) / M.enter));
          if (M.text === 'mask') {
            w.inner.style.transform = `translateY(${(1 - p) * 110}%)`;
          } else if (M.text === 'scale') {
            w.inner.style.opacity = p;
            w.inner.style.transform = `scale(${lerp(0.6, 1, p)})`;
          } else {
            w.inner.style.opacity = p;
            w.inner.style.transform = `translateY(${(1 - p) * 0.45}em)`;
            w.inner.style.filter = p < 1 ? `blur(${(1 - p) * 12}px)` : 'none';
          }
          if (w.deco) {
            const q = E(
              clamp(
                (lt - delay - i * stagger - M.enter * 0.6) / (M.enter * 1.2)
              )
            );
            w.deco.style.transform = `scaleX(${q})`;
          }
        });
        return delay + words.length * stagger + M.enter;
      }
      const fade = (node, lt, start, dur = M.enter, dy = 24) => {
        const p = E(clamp((lt - start) / dur));
        node.style.opacity = p;
        node.style.transform = `translateY(${(1 - p) * dy}px)`;
        return p;
      };

      // ---- scene types: build(root, scene) returns render(lt) ----
      const TYPES = {
        title(root, sc) {
          const box = el('div', 'center', root);
          const eb = sc.eyebrow
            ? el('div', 'eyebrow', box, esc(sc.eyebrow))
            : null;
          const h = el('div', 'display', box);
          h.style.fontSize = (sc.size || (VERT ? 128 : 150)) + 'px';
          const words = buildText(h, sc.text);
          const sub = sc.sub ? el('div', 'sub', box, esc(sc.sub)) : null;
          if (sub) sub.style.maxWidth = '1200px';
          return lt => {
            if (eb) fade(eb, lt, 0);
            const end = animateWords(words, lt, eb ? 0.2 : 0);
            if (sub) fade(sub, lt, end - 0.25);
            box.style.transform = `scale(${1 + lt * M.drift})`;
          };
        },
        statement(root, sc) {
          const box = el('div', 'center', root);
          const h = el('div', 'display', box);
          h.style.fontSize = (sc.size || (VERT ? 96 : 112)) + 'px';
          h.style.maxWidth = VERT ? '95%' : '1500px';
          const words = buildText(h, sc.text);
          const sub = sc.sub ? el('div', 'sub', box, esc(sc.sub)) : null;
          return lt => {
            const end = animateWords(words, lt, 0);
            if (sub) fade(sub, lt, end - 0.2);
            box.style.transform = `scale(${1 + lt * M.drift})`;
          };
        },
        capture(root, sc) {
          const cap = sc._capture;
          const split = sc.layout === 'split' && !VERT;
          const wrap = el('div', null, root);
          wrap.style.cssText =
            `position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:70px;padding:0 ${split ? 90 : 0}px;perspective:2200px;` +
            (VERT ? 'flex-direction:column;gap:56px;' : '');
          let side = null,
            sideWords = [],
            sideText = null;
          if (split || (VERT && sc.heading)) {
            side = el('div', null, wrap);
            side.style.cssText = `flex:0 0 ${split ? '30%' : 'auto'};display:flex;flex-direction:column;gap:26px;${VERT ? 'text-align:center;align-items:center;padding:0 7%;' : ''}`;
            if (sc.eyebrow)
              sideText = el('div', 'eyebrow', side, esc(sc.eyebrow));
            const h = el('div', 'display', side);
            h.style.fontSize = (VERT ? 78 : 76) + 'px';
            sideWords = buildText(h, sc.heading || '');
            if (sc.text) {
              const p = el('div', 'sub', side, esc(sc.text));
              p.style.fontSize = '30px';
              side._p = p;
            }
          }
          const aspect = cap.width / cap.height;
          const chromeH = S.frame.chrome === 'browser' ? 46 : 0;
          let fw = split ? W * 0.56 : VERT ? W * 0.9 : W * (sc.width || 0.78);
          let vh = fw / aspect;
          const maxH = H * (VERT ? 0.52 : split ? 0.74 : 0.8) - chromeH;
          if (vh > maxH) {
            vh = maxH;
            fw = vh * aspect;
          }
          const frame = el('div', 'frame', wrap);
          frame.style.width = fw + 'px';
          if (chromeH) {
            const ch = el('div', 'chrome', frame, '<i></i><i></i><i></i>');
            el('div', 'url', ch, esc(sc.url || cap.url || ''));
          }
          const vp = el('div', 'viewport', frame);
          vp.style.width = fw + 'px';
          vp.style.height = vh + 'px';
          const cam = el('div', 'cam', vp);
          cam.style.width = cap.width + 'px';
          cam.style.height = cap.height + 'px';
          const img = el('img', null, cam);
          img.style.width = cap.width + 'px';
          img.style.height = cap.height + 'px';
          const showCursor = sc.cursor !== false && cap.cursor.length;
          const cursor = showCursor
            ? el(
                'div',
                'cursor',
                cam,
                '<svg viewBox="0 0 28 28" width="28" height="28"><path d="M4 2l18 10.5-7.6 1.6L19 23l-3.6 1.7-4.6-9-6.8 5.2z" fill="#fff" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/></svg>'
              )
            : null;
          const ripple = showCursor ? el('div', 'ripple', cam) : null;
          const caption = sc.caption
            ? el('div', 'caption', root, esc(sc.caption))
            : null;
          if (caption && VERT) {
            caption.style.bottom = '140px';
          }

          const fit = fw / cap.width;
          const keys = (sc.zoom || []).map(z => ({
            at: z.at || 0,
            dur: z.dur ?? M.zoomDuration,
            r:
              z.rect === 'full' || !z.rect
                ? [0, 0, cap.width, cap.height]
                : z.rect,
          }));
          if (!keys.length || keys[0].at > 0)
            keys.unshift({ at: 0, dur: 0, r: [0, 0, cap.width, cap.height] });
          const camFor = r => {
            const s = Math.min(fw / r[2], vh / r[3]);
            const cx = r[0] + r[2] / 2,
              cy = r[1] + r[3] / 2;
            return { s, x: fw / 2 - cx * s, y: vh / 2 - cy * s };
          };
          const clampCam = c => {
            // keep the capture covering the viewport (no white edges)
            c.s = Math.max(c.s, fit);
            c.x = Math.min(0, Math.max(fw - cap.width * c.s, c.x));
            c.y = Math.min(0, Math.max(vh - cap.height * c.s, c.y));
            return c;
          };
          const camAt = lt => {
            let cur = clampCam(camFor(keys[0].r));
            for (let i = 1; i < keys.length; i++) {
              const k = keys[i];
              if (lt < k.at) break;
              const p = EASE.inout(clamp((lt - k.at) / Math.max(k.dur, 0.001)));
              const nxt = clampCam(camFor(k.r));
              cur = {
                s: lerp(cur.s, nxt.s, p),
                x: lerp(cur.x, nxt.x, p),
                y: lerp(cur.y, nxt.y, p),
              };
            }
            return cur;
          };
          const from = sc._from || 0,
            speed = sc.speed || 1;
          return lt => {
            const ct = from + lt * speed;
            const src = cap.frameAt(ct);
            let pending = null;
            if (img._src !== src) {
              img._src = src;
              img.src = src;
              pending = img.decode().catch(() => {});
            }
            const c = camAt(lt);
            cam.style.transform = `translate(${c.x}px, ${c.y}px) scale(${c.s})`;
            if (cursor) {
              const p = cap.cursorAt(ct);
              cursor.style.transform = `translate(${p.x - 5}px, ${p.y - 3}px) scale(${(1 / Math.sqrt(c.s / fit) / fit) * 0.9})`;
              const click = cap.lastClick(ct);
              const age = click ? ct - click.t : 99;
              if (age < 0.6) {
                const q = EASE.cubic(age / 0.6);
                ripple.style.opacity = 1 - q;
                ripple.style.left = click.x + 'px';
                ripple.style.top = click.y + 'px';
                ripple.style.transform = `scale(${(0.3 + q * 0.9) / Math.sqrt(c.s / fit) / fit})`;
              } else ripple.style.opacity = 0;
            }
            const pe = E(clamp(lt / (M.enter * 1.6)));
            const tilt = S.frame.tilt ? (1 - pe) * 18 : 0;
            frame.style.transform = `translateY(${(1 - pe) * 80}px) rotateX(${tilt}deg) scale(${lerp(0.94, 1, pe) + lt * M.drift * 0.5})`;
            frame.style.opacity = clamp(pe * 1.4);
            if (side) {
              if (sideText) fade(sideText, lt, 0.1);
              const end = animateWords(sideWords, lt, 0.2);
              if (side._p) fade(side._p, lt, end - 0.2);
            }
            if (caption) {
              const q = E(clamp((lt - (sc.captionAt ?? 0.7)) / M.enter));
              caption.style.opacity = q;
              caption.style.transform = `translateX(-50%) translateY(${(1 - q) * 30}px) scale(${lerp(0.92, 1, q)})`;
            }
            return pending;
          };
        },
        features(root, sc) {
          const box = el('div', 'center', root);
          box.style.width = '100%';
          box.style.padding = VERT ? '0 7%' : '0 9%';
          box.style.gap = '56px';
          const h = el('div', 'display', box);
          h.style.fontSize = (VERT ? 82 : 84) + 'px';
          const words = buildText(h, sc.heading || '');
          const grid = el('div', 'cards', box);
          const n = sc.items.length;
          grid.style.gridTemplateColumns = `repeat(${VERT ? 1 : Math.min(n, sc.columns || 3)}, 1fr)`;
          const cards = sc.items.map(it => {
            const c = el('div', 'card', grid);
            c.style.textAlign = 'left';
            if (it.icon) el('div', 'ic', c, esc(it.icon));
            el('h3', null, c, esc(it.title));
            if (it.text) el('p', null, c, esc(it.text));
            return c;
          });
          return lt => {
            const end = animateWords(words, lt, 0);
            cards.forEach((c, i) => {
              const p = EASE.back(
                clamp(
                  (lt - end + 0.3 - i * (sc.stagger || 0.14)) / (M.enter * 1.1)
                )
              );
              c.style.opacity = clamp(p);
              c.style.transform = `translateY(${(1 - p) * 60}px) scale(${lerp(0.9, 1, p)})`;
            });
          };
        },
        stat(root, sc) {
          const box = el('div', 'center', root);
          if (sc.eyebrow) box._eb = el('div', 'eyebrow', box, esc(sc.eyebrow));
          const n = el('div', 'display stat hl-gradient', box);
          if (VERT) n.style.fontSize = '200px';
          const label = el('div', 'sub', box, esc(sc.label || ''));
          label.style.fontSize = '40px';
          label.style.color = 'var(--fg)';
          const dec = String(sc.value).includes('.')
            ? String(sc.value).split('.')[1].length
            : 0;
          return lt => {
            if (box._eb) fade(box._eb, lt, 0);
            const p = EASE.expo(clamp((lt - 0.15) / (sc.countDuration || 1.6)));
            const v = (sc.from || 0) + (sc.value - (sc.from || 0)) * p;
            n.textContent =
              (sc.prefix || '') +
              v.toLocaleString('en-US', {
                minimumFractionDigits: dec,
                maximumFractionDigits: dec,
              }) +
              (sc.suffix || '');
            const q = E(clamp(lt / M.enter));
            n.style.opacity = q;
            n.style.transform = `scale(${lerp(0.85, 1, q) + lt * M.drift})`;
            fade(label, lt, 0.5);
          };
        },
        end(root, sc) {
          const box = el('div', 'center', root);
          box.style.gap = '36px';
          const logo = sc.logo ? el('img', null, box) : null;
          if (logo) {
            logo.src = asset(sc.logo);
            logo.style.height = '120px';
          }
          const h = el('div', 'display', box);
          h.style.fontSize = (sc.size || (VERT ? 120 : 140)) + 'px';
          const words = buildText(h, sc.text);
          const tag = sc.sub ? el('div', 'sub', box, esc(sc.sub)) : null;
          const cta = sc.cta
            ? el('div', 'cta', box, esc(sc.cta) + ' &rarr;')
            : null;
          const url = sc.url ? el('div', 'url-line', box, esc(sc.url)) : null;
          return lt => {
            if (logo) fade(logo, lt, 0, M.enter, 0);
            const end = animateWords(words, lt, logo ? 0.25 : 0);
            if (tag) fade(tag, lt, end - 0.3);
            if (cta) {
              const p = EASE.back(clamp((lt - end) / M.enter));
              cta.style.opacity = clamp(p);
              cta.style.transform = `scale(${lerp(0.8, 1, p)})`;
            }
            if (url) fade(url, lt, end + 0.25);
          };
        },
      };

      // ---- background ----
      function buildBackground(stage) {
        const bg = el('div', 'bg', stage);
        const kind = S.background;
        const blobs = [];
        if (kind === 'aurora' || kind === 'grid') {
          const cols = [S.palette.accent, S.palette.accent2, S.palette.accent];
          cols.forEach((c, i) => {
            const b = el('div', 'blob', bg);
            const size = Math.max(W, H) * (0.75 - i * 0.12);
            b.style.width = b.style.height = size + 'px';
            b.style.background = `radial-gradient(circle, rgba(${rgb(c)},${S.glow}) 0%, rgba(${rgb(c)},0) 62%)`;
            blobs.push({ b, size, i });
          });
        }
        if (kind === 'grid') el('div', 'grid-lines', bg);
        if (kind === 'gradient')
          bg.style.background = `linear-gradient(160deg, var(--bg2) 0%, var(--bg) 60%)`;
        if (S.grain > 0) {
          const g = el('div', 'grain', stage);
          g.style.backgroundImage = `url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")`;
        }
        el('div', 'vignette', stage);
        return t => {
          blobs.forEach(({ b, size, i }) => {
            const a = t * 0.12 + i * 2.1;
            const x = W * (0.5 + 0.32 * Math.cos(a + i)) - size / 2;
            const y = H * (0.5 + 0.28 * Math.sin(a * 1.3 + i * 1.7)) - size / 2;
            b.style.transform = `translate(${x}px, ${y}px)`;
          });
        };
      }

      // ---- capture lookups (frames are timestamped screencast stills) ----
      function prepareCapture(cap) {
        const frames = cap.frames;
        const ts = frames.map(f => f.t);
        const bs = (arr, t) => {
          let lo = 0,
            hi = arr.length - 1,
            r = 0;
          while (lo <= hi) {
            const mid = (lo + hi) >> 1;
            if (arr[mid] <= t) {
              r = mid;
              lo = mid + 1;
            } else hi = mid - 1;
          }
          return r;
        };
        cap.frameAt = t => asset(cap.dir + '/' + frames[bs(ts, t)].file);
        const cur = cap.cursor || [];
        const cts = cur.map(c => c.t);
        cap.cursorAt = t => {
          if (!cur.length) return { x: -100, y: -100 };
          const i = bs(cts, t),
            a = cur[i],
            b = cur[i + 1];
          if (!b || t <= a.t) return a;
          const p = clamp((t - a.t) / (b.t - a.t));
          return { x: lerp(a.x, b.x, p), y: lerp(a.y, b.y, p) };
        };
        const clicks = cur.filter(c => c.click);
        cap.lastClick = t => {
          let r = null;
          for (const c of clicks) {
            if (c.t <= t) r = c;
            else break;
          }
          return r;
        };
        return cap;
      }

      window.__init = data => {
        S = data.style;
        M = S.motion;
        E = EASE[M.ease] || EASE.expo;
        W = data.width;
        H = data.height;
        VERT = H > W;
        BASE = data.base;
        const p = S.palette;
        const dark = luminance(p.bg) < 0.25;
        const root = document.documentElement.style;
        const vars = {
          '--bg': p.bg,
          '--bg2': p.bg2 || p.bg,
          '--fg': p.fg,
          '--muted': p.muted,
          '--accent': p.accent,
          '--accent2': p.accent2 || p.accent,
          '--on-accent':
            p.onAccent || (luminance(p.accent) > 0.45 ? '#0b0b0f' : '#ffffff'),
          '--line': dark ? 'rgba(255,255,255,.06)' : 'rgba(0,0,0,.06)',
          '--line-strong': dark ? 'rgba(255,255,255,.12)' : 'rgba(0,0,0,.10)',
          '--card':
            p.card ||
            (dark ? 'rgba(255,255,255,.04)' : 'rgba(255,255,255,.75)'),
          '--glass': dark ? 'rgba(20,22,30,.62)' : 'rgba(255,255,255,.72)',
          '--chrome': p.chrome || (dark ? '#14161d' : '#f2f3f5'),
          '--font-display': `"${S.font.display}"`,
          '--font-body': `"${S.font.body}"`,
          '--font-mono': `"${S.font.mono}"`,
          '--w-display': S.font.weightDisplay,
          '--tracking': S.font.tracking,
          '--radius': S.frame.radius + 'px',
          '--grain': S.grain,
          '--vignette': S.vignette,
        };
        for (const k in vars) root.setProperty(k, vars[k]);

        const stage = document.getElementById('stage');
        stage.style.width = W + 'px';
        stage.style.height = H + 'px';
        stage.style.transform = `scale(${data.scale || 1})`;
        bgLayer = buildBackground(stage);

        const td = M.transition === 'cut' ? 0 : M.transitionDuration;
        let start = 0;
        scenes = data.storyboard.scenes.map((sc, i) => {
          if (sc._capture) prepareCapture(sc._capture);
          const layer = el('div', 'layer', stage);
          const render = TYPES[sc.type](layer, sc);
          const s = {
            sc,
            layer,
            render,
            start,
            dur: sc.duration,
            td: sc.transition === 'cut' ? 0 : td,
          };
          start +=
            sc.duration - (i < data.storyboard.scenes.length - 1 ? s.td : 0);
          return s;
        });
        total = start;
        const brand = data.storyboard.brand;
        if (brand && S.cornerMark) {
          const m = el('div', 'mark', stage);
          if (brand.logo) el('img', null, m).src = asset(brand.logo);
          else el('span', 'dot', m);
          el('span', null, m, esc(brand.name));
          scenes.markEl = m;
        }
        return {
          duration: total,
          scenes: scenes.map(s => ({
            type: s.sc.type,
            start: s.start,
            duration: s.dur,
          })),
        };
      };

      window.__seek = async t => {
        bgLayer(t);
        const waits = [];
        for (const s of scenes) {
          const lt = t - s.start;
          const visible = lt >= 0 && lt <= s.dur;
          s.layer.style.display = visible ? 'flex' : 'none';
          if (!visible) continue;
          const enter = s.td ? clamp(lt / s.td) : 1;
          const exit = s.td ? clamp((lt - (s.dur - s.td)) / s.td) : 0;
          const first = s === scenes[0],
            last = s === scenes[scenes.length - 1];
          const ei = first ? 1 : EASE.cubic(enter),
            xo = last ? 0 : EASE.cubic(exit);
          let tf = '',
            filt = 'none';
          switch (M.transition) {
            case 'slide':
              tf = `translateX(${(1 - ei) * 8 - xo * 8}%)`;
              break;
            case 'fade':
              break;
            case 'cut':
              break;
            default:
              tf = `scale(${lerp(1.06, 1, ei) * lerp(1, 0.96, xo)})`;
              filt =
                ei < 1 || xo > 0
                  ? `blur(${(1 - ei) * 14 + xo * 14}px)`
                  : 'none';
          }
          s.layer.style.opacity = M.transition === 'cut' ? 1 : ei * (1 - xo);
          s.layer.style.transform = tf;
          s.layer.style.filter = filt;
          const r = s.render(lt);
          if (r) waits.push(r);
        }
        if (scenes.markEl) {
          const inBody = scenes.filter(
            s =>
              s.sc.type !== 'title' &&
              s.sc.type !== 'end' &&
              t >= s.start &&
              t <= s.start + s.dur
          ).length;
          scenes.markEl.style.opacity = inBody ? 1 : 0;
        }
        await Promise.all(waits);
      };
    </script>
  </body>
</html>
